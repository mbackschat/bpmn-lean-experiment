name: Verify

on:
  pull_request:
  # Branch pushes are covered by their pull request, so restricting this to the
  # default branch keeps one run per change instead of two.
  push:
    branches:
      - main
  # A weekly run catches a default branch that went red without a push, and its
  # cache-free Lean build keeps a from-scratch signal that cached runs hide.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      skip_lean_cache:
        description: Verify without the Lean build cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded branch runs are cancelled, while every commit on the default
  # branch keeps its own completed verification record.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # One decision for the Lean build cache, announced by the first step so
      # every run records which mode produced its result. The weekly schedule
      # and an explicit dispatch both verify from scratch.
      LEAN_CACHE: ${{ github.event_name != 'schedule' && github.event.inputs.skip_lean_cache != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Report Lean cache mode
        run: |
          echo "event=${{ github.event_name }} LEAN_CACHE=$LEAN_CACHE"
          test "$LEAN_CACHE" = "true" || echo "verifying from scratch: no Lean build cache"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up libxml2 tools
        # Verification validates BPMN XML with xmllint. The macOS runner image
        # already resolves one; the Ubuntu image has no libxml2-utils package.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libxml2-utils

      - name: Resolve pinned toolchain versions
        # package.json owns both pins, so CI reads them through the same script the
        # wrapper and doctor use instead of restating versions a bump would miss.
        id: pins
        run: |
          eval "$(./scripts/pinned-toolchain.sh)"
          {
            printf 'node=%s\n' "$required_node_version"
            printf 'pnpm=%s\n' "$required_pnpm_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.pins.outputs.pnpm }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: runners/cibseven/pom.xml

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false

      - name: Resolve the external source root
        # The scripts default this to repository sibling `../oss`, but
        # actions/cache rejects a glob containing a `..` segment and reports it
        # only as a post-job warning, so a relative path leaves a green run that
        # cached nothing. Exporting the resolved absolute root keeps the sibling
        # layout and gives the cache and every provisioning script one value.
        run: printf 'BPMN_EXTERNAL_ROOT=%s\n' "$(cd "$GITHUB_WORKSPACE/.." && pwd)/oss" >> "$GITHUB_ENV"

      - name: Cache the pinned OMG corpus
        # Every run otherwise downloads all 15 official files from omg.org, on
        # both platforms, to let the default gate read two of them. That staked
        # each build on a third-party server: on 2026-08-06 a run died fetching
        # an archive no default-lane gate opens. A restored corpus weakens
        # nothing, because setup-external-sources.sh verifies an existing tree
        # against the tracked manifest instead of fetching it. The key is the
        # manifest itself, so changing the official set misses and refetches.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.BPMN_EXTERNAL_ROOT }}/omg-bpmn-2.0.2
          key: bpmn-corpus-${{ runner.os }}-${{ hashFiles('docs/reference/bpmn-2.0.2/LOCAL-CORPUS.sha256') }}

      - name: Provision pinned external inputs
        run: ./scripts/setup-external-sources.sh verify

      - name: Cache Lean build output
        # lean-action only restores `.lake`; it registers no save step because
        # verify.sh owns the build. Without this, every run rebuilds Lean from
        # scratch, which measured 79s of a 213s Ubuntu run. The key is the exact
        # Lean source state, so an unchanged tree hits and a changed tree falls
        # back to the newest prefix match for an incremental rebuild. The
        # scheduled run skips the cache to keep one from-scratch build a week.
        if: env.LEAN_CACHE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'BpmnSemantics/**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        env:
          CI: "true"
          # The hosted aggregate ceiling must outlive the longest nested CIB
          # deadline plus reporting cleanup. Per-lane deadlines detect hangs.
          BPMN_PIPELINE_WARM_BUDGET_MS: "130000"
        run: ./scripts/pnpm.sh run test:pre-push:verify

  # One stable check name for branch protection. Requiring the matrix jobs
  # directly would name each platform, so editing the matrix would silently
  # leave a stale requirement behind. `always()` is required: without it a
  # failed matrix leaves this job skipped, and a skipped check can satisfy a
  # required-check rule instead of blocking it.
  verify-complete:
    name: verify-complete
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform to have verified
        run: |
          echo "matrix result: ${{ needs.verify.result }}"
          test "${{ needs.verify.result }}" = "success"
