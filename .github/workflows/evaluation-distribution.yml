name: Evaluation distribution

on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish missing evaluation images for the selected source revision
        required: false
        type: boolean
        default: false
      published_revision:
        description: Re-accept an exact 40-character revision whose five images are already published
        required: false
        type: string
        default: ""
      refresh_walkthrough_screenshots:
        description: Refresh and upload the maintained browser walkthrough screenshots
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: evaluation-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images != true && inputs.published_revision == '' && inputs.refresh_walkthrough_screenshots != true
    name: Smoke-test the source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the source distribution
        run: |
          docker compose up --build --wait
          docker compose --profile demo run --rm --build --no-deps guided-demo-seed

      - name: Verify the public application origin
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/definitions >/dev/null

      - name: Show source service state after failure
        if: failure()
        run: docker compose ps --all && docker compose logs --no-color --timestamps

      - name: Stop the source distribution
        if: always()
        run: docker compose down --volumes --remove-orphans

  walkthrough-screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_walkthrough_screenshots == true
    name: Refresh browser walkthrough screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned toolchain versions
        id: pins
        run: |
          eval "$(./scripts/pinned-toolchain.sh)"
          {
            printf 'node=%s\n' "$required_node_version"
            printf 'pnpm=%s\n' "$required_pnpm_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.pins.outputs.pnpm }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser Chromium
        run: ./scripts/pnpm.sh --filter @bpmn-lean/showcase-platform-browser-walkthrough exec playwright install --with-deps chromium

      - name: Refresh browser walkthrough screenshots
        run: ./scripts/pnpm.sh run walkthrough:screenshots:refresh

      - name: Upload browser walkthrough screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bpm-platform-browser-walkthrough-screenshots-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: docs/assets/bpm-platform-browser-walkthrough/

  published-candidate:
    if: github.event_name == 'push' || inputs.publish_images == true || inputs.published_revision != ''
    name: Publish or resolve immutable evaluation candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.candidate.outputs.artifact }}
      revision: ${{ steps.candidate.outputs.revision }}
      source_tree_sha256: ${{ steps.candidate.outputs.source_tree_sha256 }}
    steps:
      - name: Check out workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.published_revision || github.sha }}
          path: .candidate-source

      - name: Resolve immutable candidate identity
        id: candidate
        run: |
          set -euo pipefail
          requested_revision='${{ inputs.published_revision }}'
          if [ -n "$requested_revision" ] && ! printf '%s\n' "$requested_revision" | grep -Eq '^[0-9a-f]{40}$'; then
            printf 'published_revision must be an exact lowercase 40-character commit SHA\n' >&2
            exit 1
          fi
          revision="$(git -C .candidate-source rev-parse HEAD)"
          source_tree_sha256="$(git -C .candidate-source ls-tree -r --full-tree -z HEAD | sha256sum | cut -d ' ' -f 1)"
          {
            printf 'artifact=guided-live-demo-candidate-%s-%s\n' "$revision" "$GITHUB_RUN_ATTEMPT"
            printf 'revision=%s\n' "$revision"
            printf 'source_tree_sha256=%s\n' "$source_tree_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for multi-platform images
        if: github.event_name == 'push' || inputs.publish_images == true
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push' || inputs.publish_images == true
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish missing immutable multi-platform images
        if: github.event_name == 'push' || inputs.publish_images == true
        env:
          BPMN_EVALUATION_CONTEXT: .candidate-source
          BPMN_EVALUATION_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          BPMN_EVALUATION_IMAGE_TAG: sha-${{ steps.candidate.outputs.revision }}
          BPMN_EVALUATION_SOURCE_REVISION: ${{ steps.candidate.outputs.revision }}
          BPMN_EVALUATION_SOURCE_TREE_SHA256: ${{ steps.candidate.outputs.source_tree_sha256 }}
        run: |
          set -euo pipefail
          image_prefix="${BPMN_EVALUATION_IMAGE_PREFIX,,}"
          export BPMN_EVALUATION_IMAGE_PREFIX="$image_prefix"
          targets=(platform-api platform-recovery-worker platform-migrate bpmn-worker guided-demo-seed)
          missing_targets=()
          for target in "${targets[@]}"; do
            if ! docker buildx imagetools inspect "$image_prefix/evaluation-$target:$BPMN_EVALUATION_IMAGE_TAG" >/dev/null 2>&1; then
              missing_targets+=("$target")
            fi
          done
          if [ "${#missing_targets[@]}" -gt 0 ]; then
            mkdir -p .artifacts
            docker buildx bake \
              --file deploy/evaluation/docker-bake.hcl \
              --metadata-file .artifacts/build-metadata.json \
              --push \
              "${missing_targets[@]}"
            for target in "${missing_targets[@]}"; do
              metadata_digest="$(jq -er --arg target "$target" '.[$target]["containerimage.digest"]' .artifacts/build-metadata.json)"
              inspection="$(docker buildx imagetools inspect \
                "$image_prefix/evaluation-$target:$BPMN_EVALUATION_IMAGE_TAG")"
              published_digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" { print $2; exit }')"
              if [ "$metadata_digest" != "$published_digest" ]; then
                printf 'Published digest differs from BuildKit metadata for %s\n' "$target" >&2
                exit 1
              fi
            done
          fi

      - name: Assemble exact-digest zero-build candidate
        env:
          BPMN_EVALUATION_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          image_prefix="${BPMN_EVALUATION_IMAGE_PREFIX,,}"
          BPMN_EVALUATION_IMAGE_PREFIX="$image_prefix" \
            deploy/evaluation/prepare-published-bundle.sh \
              .candidate-source \
              '${{ steps.candidate.outputs.revision }}' \
              '${{ steps.candidate.outputs.source_tree_sha256 }}' \
              .artifacts/guided-live-demo

      - name: Upload immutable zero-build candidate before acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.candidate.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30
          path: .artifacts/guided-live-demo/

  accept-published-candidate:
    name: Accept exact published candidate twice
    needs: published-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out acceptance oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize acceptance evidence
        run: |
          mkdir -p .artifacts/acceptance
          jq -n \
            --arg acceptanceRevision "$GITHUB_SHA" \
            --arg candidateRevision '${{ needs.published-candidate.outputs.revision }}' \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            '{acceptanceRevision: $acceptanceRevision, candidateRevision: $candidateRevision, workflowRef: $workflowRef}' \
            > .artifacts/acceptance/identity.json

      - name: Download immutable zero-build candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.published-candidate.outputs.artifact }}
          path: .artifacts/guided-live-demo

      - name: Resolve pinned toolchain versions
        id: pins
        run: |
          eval "$(./scripts/pinned-toolchain.sh)"
          {
            printf 'node=%s\n' "$required_node_version"
            printf 'pnpm=%s\n' "$required_pnpm_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.pins.outputs.pnpm }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: pnpm

      - name: Install acceptance dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser Chromium
        run: ./scripts/pnpm.sh --filter @bpmn-lean/showcase-guided-live-demo exec playwright install --with-deps chromium

      - name: Build guided audience acceptance
        run: ./scripts/pnpm.sh run build:showcase-guided-live-demo

      - name: Prove anonymous zero-build startup from exact published digests
        run: |
          docker logout ghcr.io || true
          .artifacts/guided-live-demo/deploy/evaluation/demo prepare
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/definitions >/dev/null

      - name: Prove first complete guided audience journey
        run: ./scripts/pnpm.sh --filter @bpmn-lean/showcase-guided-live-demo run test:e2e:built
        env:
          BPMN_EVALUATION_ORIGIN: http://127.0.0.1:3000
          BPMN_PLAYWRIGHT_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/acceptance/playwright/journey-1/test-results
          BPMN_PLAYWRIGHT_REPORT_DIR: ${{ github.workspace }}/.artifacts/acceptance/playwright/journey-1/report

      - name: Verify stable runtime after first journey
        run: deploy/evaluation/verify-runtime-stability.sh .artifacts/guided-live-demo

      - name: Reset exact published candidate between journeys
        run: .artifacts/guided-live-demo/deploy/evaluation/demo reset

      - name: Prove second complete guided audience journey after reset
        run: ./scripts/pnpm.sh --filter @bpmn-lean/showcase-guided-live-demo run test:e2e:built
        env:
          BPMN_EVALUATION_ORIGIN: http://127.0.0.1:3000
          BPMN_PLAYWRIGHT_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/acceptance/playwright/journey-2/test-results
          BPMN_PLAYWRIGHT_REPORT_DIR: ${{ github.workspace }}/.artifacts/acceptance/playwright/journey-2/report

      - name: Verify stable runtime after second journey
        run: deploy/evaluation/verify-runtime-stability.sh .artifacts/guided-live-demo

      - name: Restore published presenter state
        run: |
          .artifacts/guided-live-demo/deploy/evaluation/demo reset
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/definitions >/dev/null
          deploy/evaluation/verify-runtime-stability.sh .artifacts/guided-live-demo

      - name: Collect acceptance diagnostics
        if: always()
        run: deploy/evaluation/collect-diagnostics.sh .artifacts/guided-live-demo .artifacts/acceptance/runtime

      - name: Stop the published evaluation distribution
        if: always()
        run: |
          if [ -x .artifacts/guided-live-demo/deploy/evaluation/demo ]; then
            .artifacts/guided-live-demo/deploy/evaluation/demo stop
          fi

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guided-live-demo-acceptance-${{ needs.published-candidate.outputs.revision }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: .artifacts/acceptance/
