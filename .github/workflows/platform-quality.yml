name: Product 2 platform quality

on:
  pull_request:
    paths:
      - ".github/workflows/platform-quality.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.platform-harness.json"
      - "packages/contract-types/**"
      - "packages/engine-api/**"
      - "packages/temporal-adapter/client/**"
      - "packages/temporal-adapter/protocol/**"
      - "platform/apps/server/**"
      - "platform/contracts/**"
      - "platform/foundation/**"
      - "platform/modules/**"
      - "scripts/*.platform-test.ts"
      - "scripts/ci-change-selection.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/platform-quality.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.platform-harness.json"
      - "packages/contract-types/**"
      - "packages/engine-api/**"
      - "packages/temporal-adapter/client/**"
      - "packages/temporal-adapter/protocol/**"
      - "platform/apps/server/**"
      - "platform/contracts/**"
      - "platform/foundation/**"
      - "platform/modules/**"
      - "scripts/*.platform-test.ts"
      - "scripts/ci-change-selection.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-2-platform-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  platform-quality:
    name: platform quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve pinned toolchain versions
        id: pins
        run: |
          eval "$(./scripts/pinned-toolchain.sh)"
          {
            printf 'node=%s\n' "$required_node_version"
            printf 'pnpm=%s\n' "$required_pnpm_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.pins.outputs.pnpm }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Product 2 platform
        run: ./scripts/pnpm.sh run test:pre-push:platform
