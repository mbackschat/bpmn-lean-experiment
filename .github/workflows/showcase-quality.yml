name: Product 2 showcase quality

on:
  pull_request:
    paths:
      - ".github/workflows/showcase-quality.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/engine-api/**"
      - "packages/temporal-adapter/client/**"
      - "packages/temporal-adapter/testkit/**"
      - "platform/apps/server/**"
      - "platform/contracts/**"
      - "showcase/m1-definition-deployment/**"
      - "showcase/m2-definition-scheduling/**"
      - "showcase/m2-message-start-ingress/**"
      - "showcase/m2-process-instance-search/**"
      - "showcase/m3-human-work/**"
      - "showcase/m4-incident-operations/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/showcase-quality.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/engine-api/**"
      - "packages/temporal-adapter/client/**"
      - "packages/temporal-adapter/testkit/**"
      - "platform/apps/server/**"
      - "platform/contracts/**"
      - "showcase/m1-definition-deployment/**"
      - "showcase/m2-definition-scheduling/**"
      - "showcase/m2-message-start-ingress/**"
      - "showcase/m2-process-instance-search/**"
      - "showcase/m3-human-work/**"
      - "showcase/m4-incident-operations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-2-showcase-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  showcase-quality:
    name: showcase type compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve pinned toolchain versions
        id: pins
        run: |
          eval "$(./scripts/pinned-toolchain.sh)"
          {
            printf 'node=%s\n' "$required_node_version"
            printf 'pnpm=%s\n' "$required_pnpm_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.pins.outputs.pnpm }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Product 2 showcase types
        run: ./scripts/pnpm.sh run test:pre-push:showcase
