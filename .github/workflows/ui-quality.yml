name: Product 2 UI quality

on:
  pull_request:
    paths:
      - ".github/workflows/ui-quality.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "platform/apps/web/**"
      - "platform/contracts/**"
      - "platform/ui-kit/**"
      - "showcase/platform-ui-quality/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ui-quality.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "platform/apps/web/**"
      - "platform/contracts/**"
      - "platform/ui-kit/**"
      - "showcase/platform-ui-quality/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-2-ui-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ui-quality:
    name: ui-quality (pinned Linux Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve pinned toolchain versions
        id: pins
        run: |
          eval "$(./scripts/pinned-toolchain.sh)"
          {
            printf 'node=%s\n' "$required_node_version"
            printf 'pnpm=%s\n' "$required_pnpm_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.pins.outputs.pnpm }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm --filter @bpmn-lean/showcase-platform-ui-quality exec playwright install --with-deps chromium

      - name: Verify Product 2 UI quality
        run: ./scripts/pnpm.sh run test:ui-quality

      - name: Upload UI-quality failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-2-ui-quality-failure
          if-no-files-found: ignore
          retention-days: 14
          path: |
            showcase/platform-ui-quality/playwright-report/
            showcase/platform-ui-quality/test-results/
