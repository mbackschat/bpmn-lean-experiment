name: Product 2 UI quality

on:
  pull_request:
    paths:
      - ".github/workflows/ui-quality.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "platform/apps/web/**"
      - "platform/contracts/**"
      - "platform/ui-kit/**"
      - "showcase/platform-ui-quality/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ui-quality.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "platform/apps/web/**"
      - "platform/contracts/**"
      - "platform/ui-kit/**"
      - "showcase/platform-ui-quality/**"
  workflow_dispatch:
    inputs:
      regenerate_baselines:
        description: Generate candidate Linux screenshot baselines as a downloadable artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: product-2-ui-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ui-quality:
    name: ui-quality (pinned Linux Chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
      options: --init
    timeout-minutes: 10
    env:
      CI: "true"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve pinned toolchain versions
        id: pins
        run: |
          eval "$(./scripts/pinned-toolchain.sh)"
          {
            printf 'node=%s\n' "$required_node_version"
            printf 'pnpm=%s\n' "$required_pnpm_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.pins.outputs.pnpm }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Product 2 UI quality
        if: github.event_name != 'workflow_dispatch' || inputs.regenerate_baselines != true
        run: ./scripts/pnpm.sh run test:ui-quality

      - name: Generate candidate Linux baselines
        if: github.event_name == 'workflow_dispatch' && inputs.regenerate_baselines == true
        run: ./scripts/pnpm.sh run test:ui-quality:update-snapshots

      - name: Upload candidate Linux baselines
        if: github.event_name == 'workflow_dispatch' && inputs.regenerate_baselines == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-2-ui-quality-baseline-candidates
          if-no-files-found: error
          retention-days: 14
          path: showcase/platform-ui-quality/e2e/snapshots/

      - name: Upload UI-quality failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-2-ui-quality-failure
          if-no-files-found: ignore
          retention-days: 14
          path: |
            showcase/platform-ui-quality/playwright-report/
            showcase/platform-ui-quality/test-results/
