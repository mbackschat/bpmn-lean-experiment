name: CIB evidence branch

# Copies the replaced CIB evidence of one Verify run onto a branch, so a development computer that cannot reach the
# artifact storage host fetches it with git instead. The evidence bytes are the artifact's own; nothing is regenerated.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the Verify run whose replaced-cib-evidence artifact to deliver
        type: string
        required: true

permissions:
  contents: write
  actions: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the run's commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          case "$RUN_ID" in (*[!0-9]*|'') echo "run_id must be numeric" >&2; exit 1;; esac
          echo "sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}

      - name: Resolve pinned toolchain
        id: pins
        run: |
          eval "$(./scripts/pinned-toolchain.sh)"
          printf 'node=%s\n' "$required_node_version" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}

      # upload-artifact stores the files below their common ancestor, `scenarios/`, so they unpack back into it.
      - name: Install the artifact's evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name replaced-cib-evidence --dir "$RUNNER_TEMP/evidence"
          cp -R "$RUNNER_TEMP/evidence/." scenarios/
          # Every changed file must be evidence lying beside its own scenario, so a misplaced unpack fails here.
          git status --porcelain --untracked-files=all | cut -c4- | while read -r changed; do
            case "$changed" in (*cibseven-evidence.json) ;; (*) echo "not CIB evidence: $changed" >&2; exit 1;; esac
            [ -f "${changed%cibseven-evidence.json}scenario.json" ] || { echo "no scenario beside $changed" >&2; exit 1; }
          done
          # A truncated or corrupt download fails here, under the strict reader the evidence binding uses.
          git status --porcelain --untracked-files=all | cut -c4- | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseWireJsonBytes } from "./scripts/strict-json.ts";
            const files = readFileSync(0, "utf8").split("\n").filter(Boolean);
            for (const file of files) parseWireJsonBytes(readFileSync(file), file);
            console.log(`${files.length} evidence files parsed`);'

      - name: Push the evidence branch
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenarios
          git commit -m "chore(evidence): retained CIB evidence of Verify run ${RUN_ID}"
          git push origin "HEAD:refs/heads/evidence/run-${RUN_ID}"
