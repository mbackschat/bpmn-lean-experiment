name = "bpmn-lean-experiment"
version = "0.1.0"
license = "MIT"
defaultTargets = ["BpmnSemantics"]
testDriver = "BpmnSemantics"
leanOptions = { Elab.async = false }

[[lean_lib]]
name = "BpmnSemantics"

[[lean_lib]]
name = "BpmnConformance"

[[lean_exe]]
name = "checkSemanticRepresentationSpike"
root = "BpmnSemantics.Experiments.SemanticRepresentationsMain"

[[lean_exe]]
name = "checkCheckedSourceRelationExperiment"
root = "BpmnSemantics.Experiments.CheckedSourceRelationMain"

[[lean_exe]]
name = "emitSemanticProcessResults"
root = "BpmnSemantics.SemanticProcessJsonMain"

[[lean_exe]]
name = "emitEnginePopulationResults"
root = "BpmnSemantics.EnginePopulationScenarioJsonMain"

[[lean_exe]]
name = "emitCommittedExecutionPublication"
root = "BpmnSemantics.CommittedExecutionPublicationJsonMain"

[[lean_exe]]
name = "emitInternalChoiceSchedules"
root = "BpmnSemantics.InternalChoiceScheduleJsonMain"

[[lean_exe]]
name = "emitDefinitionAdmissions"
root = "BpmnSemantics.DefinitionAdmissionJsonMain"

[[lean_exe]]
name = "emitParallelScopeAdmissions"
root = "BpmnSemantics.ParallelScopeAdmissionMain"

[[lean_exe]]
name = "emitParallelScopeStartAdmissions"
root = "BpmnSemantics.ParallelScopeStartAdmissionMain"

[[lean_exe]]
name = "emitParallelScopeReservations"
root = "BpmnSemantics.ParallelScopeReservationMain"

[[lean_exe]]
name = "emitScenarioSupport"
root = "BpmnSemantics.ScenarioSupportJsonMain"

[[lean_exe]]
name = "checkCallFamilyFixtures"
root = "BpmnSemantics.CallFamilyChecksMain"
