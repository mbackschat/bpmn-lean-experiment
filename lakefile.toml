name = "bpmn-lean-experiment"
version = "0.1.0"
license = "MIT"
defaultTargets = ["BpmnSemantics"]
testDriver = "checkConformance"

[[lean_lib]]
name = "BpmnSemantics"

[[lean_exe]]
name = "checkConformance"
root = "BpmnSemantics.ConformanceMain"

[[lean_exe]]
name = "checkSemanticRepresentationSpike"
root = "BpmnSemantics.Experiments.SemanticRepresentationsMain"

[[lean_exe]]
name = "emitSequentialUserTaskResult"
root = "BpmnSemantics.SequentialUserTaskJsonMain"
